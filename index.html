<style>
:root{--bg:#0d0c0b;--paper:#f1eadb;--paper2:#e3e9df;--ink:#2a2622;--muted:#8c8476;--cream:#efe6d2;--gold:#cbaa6b;--pink:#ec9c94;--hand:"LXGW WenKai TC",serif;--serif:"Noto Serif TC",serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--cream);font-family:var(--hand);min-height:100%;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 40% 20%,#1e1c1a,#0d0c0b 70%) fixed}
#snow{position:fixed;inset:0;pointer-events:none;z-index:1}
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;transition:opacity 1s}
.screen.gone{opacity:0;pointer-events:none}

#cover p{font-size:26px;margin-top:10px;color:var(--cream)}
.tap{margin-top:40px;font-size:14px;color:var(--pink);animation:blink 1.8s infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
@keyframes blink{50%{opacity:.3}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* 2. 密碼 */
#gate .dog{width:110px;margin-bottom:16px}

#gate .hint2{color:var(--muted);font-size:13px;margin-top:6px}
#gate input{width:min(260px,78vw);margin-top:18px;background:transparent;border:0;border-bottom:1.5px solid var(--gold);color:var(--cream);font:inherit;font-size:22px;text-align:center;padding:8px;outline:none;letter-spacing:.15em}
#gate .msg{color:var(--muted);font-size:13px;margin-top:12px;min-height:20px}
#gate .msg.err{color:var(--pink)}
#gate .go{margin-top:18px}

#film{background:var(--bg);font-family:var(--serif);font-size:clamp(22px,6vw,30px);line-height:1.7}

#film .line.on{opacity:1;transform:none}
#film .skip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));right:24px;font-family:var(--hand);font-size:13px;color:var(--muted);background:none;border:0}

main.later #postsSec{order:1}main.later #cardsSec{order:2}
main.on{opacity:1}
.head{text-align:center;margin-bottom:46px}
.head .dog{width:120px;margin:0 auto 10px;animation:bob 2.6s ease-in-out infinite}
.head .eb{font-family:"Cormorant Garamond",serif;letter-spacing:.4em;font-size:12px;color:var(--muted)}
.head h2{font-family:var(--serif);font-size:34px;color:var(--cream);margin:6px 0}
.head .days{color:var(--gold);font-size:15px}
.note{position:relative;background:var(--paper);color:var(--ink);padding:22px 20px 16px;margin:0 6px 30px;border-radius:2px;box-shadow:0 10px 24px #0008;opacity:0;transform:translateY(40px) rotate(var(--r,0deg)) scale(.96);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}

.note.ian{background:var(--paper2)}
.note::before{content:"";position:absolute;top:-11px;left:50%;width:84px;height:22px;margin-left:-42px;background:#d9cbaecc;transform:rotate(var(--tr,-3deg))}
.note .tag{font-size:12px;color:#9a8f7e;letter-spacing:.1em;margin-bottom:6px}
.note .body{font-size:19px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.note .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:#9a8f7e}
.note .who{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:17px;color:#b07a6f}
.note.ian .who{color:#6f8a76}
.note .tools{white-space:nowrap;flex:none}
.note .tools button{background:none;border:0;font:inherit;font-size:12px;color:#9a8f7e;margin-left:6px;padding:4px}
.note.s-big .body{font-family:var(--serif);font-size:21px}
.note.s-big{background:#1b1917;color:var(--cream);border:1px solid #3a342c}

.note.s-big::before{background:#d9cbae66}

.facts small{display:block;font-size:12px;border-bottom:6px solid var(--ink);padding-bottom:6px;margin-bottom:2px}

.facts .row:last-child{border-bottom:0}
.note.in .facts .row{opacity:1;transform:none}
.coupon{text-align:center;cursor:pointer;perspective:800px}
.coupon .ticket{border:2px dashed #b9ab92;border-radius:10px;padding:18px}

.coupon.used .ticket{animation:pop .5s}

.inline-dog:nth-of-type(even){animation-delay:-1.4s}
textarea.edit{width:100%;min-height:120px;font:inherit;font-size:18px;border:1px solid #c9bda6;background:#fffdf7;border-radius:6px;padding:8px;color:var(--ink)}
.end{text-align:center;margin-top:60px;font-family:var(--serif);font-size:22px;line-height:1.9;opacity:0;transition:opacity 2s}
.end.in{opacity:1}
.end small{display:block;font-family:var(--hand);font-size:13px;color:var(--muted);margin-top:22px}

.sheet .row{display:flex;justify-content:space-between;margin-top:12px}
.btn{background:var(--cream);color:var(--ink);border:0;border-radius:999px;padding:10px 24px;font:inherit;font-size:16px}
.btn.ghost{background:none;color:var(--muted)}
.heart{position:fixed;z-index:40;pointer-events:none;font-size:22px;animation:fly 1.6s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),-180px) rotate(var(--rt));opacity:0}}
@media (max-width:480px){
  .note{padding:18px 16px 13px}
  .note .body{font-size:16px;line-height:1.7}
  .note.s-big .body{font-size:17px}

  .coupon .ticket b{font-size:24px}
  #posts .note.ian{margin-left:18px}#posts .note.celine{margin-right:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.note{opacity:1;transform:none}}
</style>
</head>

// ---------- 流程 ----------
// 還沒貼 Firebase 設定時進入「預覽模式」：任何密語都能進，內容只存在這次開啟的頁面
const DEMO = firebaseConfig.apiKey === "PASTE_HERE";
const db = DEMO ? null : getFirestore(initializeApp(firebaseConfig));
const demo = { rows: [], subs: [], emit() { setTimeout(() => this._emit()); }, _emit() { const rows = this.rows; this.subs.forEach(f => f({ empty: !rows.length, forEach: (cb) => rows.forEach(r => cb({ id: r.id, data: () => r })) })); } };
const T = (ms) => ({ toDate: () => new Date(ms) });
if (DEMO) Object.assign(api, {
  listen: (ok) => { demo.subs.push(ok); setTimeout(() => demo.emit(), 50); },
  seed: () => { const b = Date.now(); demo.rows = SEED.map((m, i) => ({ id: "s" + i, who: "celine", style: "", ...m, at: T(b + i * 1000) })); demo.emit(); },
  add: async (m) => { demo.rows.push({ id: "n" + Date.now(), ...m, at: T(Date.now()) }); demo.emit(); },
  edit: async (id, text) => { Object.assign(demo.rows.find(r => r.id === id), { text, editedAt: T(Date.now()) }); demo.emit(); },
  del: (id) => { demo.rows = demo.rows.filter(r => r.id !== id); demo.emit(); },
});
let col, lastSnap, who = store.get("board-who"), seeded = false;

// 密碼：大小寫、空白都不影響（23 ian / 23IAN / 23ian 都可以）
const norm = (v) => v.toLowerCase().replace(/\s+/g, "");
const LATER = Date.now() >= new Date(BIRTHDAY_END).getTime();
let started = false;
function start(code, { auto = false, film = true } = {}) {
  if (!DEMO) col = collection(db, "boards", code, "messages");
  let first = true;
  $("msg").textContent = "確認中⋯"; $("msg").classList.remove("err");
  api.listen((snap) => {
    if (first) {
      first = false; started = true; store.set("board-code", code);
      if (DEMO && snap.empty && !seeded) { seeded = true; api.seed(); }
      hide($("gate")); hide($("cover"));
      if (film) playFilm(); else openBoard();
    }
    lastSnap = snap; render(snap);
  }, () => {
    if (auto) { store.set("board-code", ""); hide($("cover")); show($("gate")); $("msg").textContent = ""; return; }
    $("msg").textContent = "不對喔，再看一次獎狀"; $("msg").classList.add("err");
    $("code").classList.remove("shake"); void $("code").offsetWidth; $("code").classList.add("shake");
  });
}
const tryCode = () => { const c = norm($("code").value); if (c) start(c); };
$("go").onclick = tryCode;
$("code").onkeydown = (e) => { if (e.key === "Enter") tryCode(); };
const savedCode = store.get("board-code");
$("cover").onclick = (e) => {
  hearts(e.clientX, e.clientY, 12); hide($("cover"));
  if (savedCode) start(savedCode, { auto: true });
  else setTimeout(() => { show($("gate")); $("code").focus(); }, 600);
};
// 生日過後、而且之前輸入過密碼：直接進留言板
if (LATER) $("board").classList.add("later");
if (LATER && savedCode) { hide($("cover")); start(savedCode, { auto: true, film: false }); }

async function playFilm() {
  show($("film")); const box = $("lines"); box.innerHTML = ""; let skip = false;
  $("skip").onclick = () => skip = true;
  for (const t of FILM) {
    if (skip) break;
    const d = document.createElement("div"); d.className = "line"; d.textContent = t; box.appendChild(d);
    await wait(60); d.classList.add("on");
    for (let i = 0; i < 13 && !skip; i++) await wait(100);
  }
  await wait(skip ? 0 : 600);
  hide($("film")); openBoard();
}
// ---------- 點閱紀錄（只有你看得到） ----------
// 每次打開網頁記一筆：時間＋裝置（蘋果／三星／其他）。頁面上不會顯示。
// 你自己要看：在網址後面加上 #c-stats-1205 打開，例如 https://…/happy-birthday-1205/#c-stats-1205
const STATS_KEY = "#c-stats-1205";
async function detectDevice() {
  const ua = navigator.userAgent; let model = "";
  try { if (navigator.userAgentData?.getHighEntropyValues) model = (await navigator.userAgentData.getHighEntropyValues(["model"])).model || ""; } catch {}
  const brand = /iPhone|iPad|iPod|Macintosh/.test(ua) ? "蘋果"
    : (/SamsungBrowser|SM-[A-Z0-9]+/.test(ua) || /^SM-/.test(model)) ? "三星"
    : /Android/.test(ua) ? "其他 Android" : "電腦／其他";
  const kind = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Macintosh/.test(ua) ? "Mac" : model || (/Android/.test(ua) ? "Android" : "Windows／其他");
  return { brand, model: kind };
}
async function trackViews() {
  if (DEMO || location.hash === STATS_KEY) return;
  try { const d = await detectDevice(); await addDoc(collection(db, "visits"), { ...d, at: serverTimestamp() }); } catch {}
}
function showStats() {
  const box = document.createElement("div"); box.id = "stats";
  box.innerHTML = "<h3>點閱紀錄</h3><div class='sum'></div><ul></ul><p style='color:var(--muted);font-size:12px;margin-top:16px'>只顯示最近 200 筆。三星手機如果用 Chrome 開也認得出來，用其他瀏覽器可能會變成「其他 Android」。</p>";
  document.body.appendChild(box);
  if (DEMO) { box.querySelector(".sum").textContent = "預覽模式不記錄，接上 Firebase 後才會有資料。"; return; }
  onSnapshot(query(collection(db, "visits"), orderBy("at", "desc"), limit(200)), (snap) => {
    const cnt = {}; const ul = box.querySelector("ul"); ul.innerHTML = "";
    snap.forEach((d) => {
      const v = d.data(); cnt[v.brand] = (cnt[v.brand] || 0) + 1;
      const li = document.createElement("li"), a = document.createElement("span"), b = document.createElement("span");
      a.textContent = `${v.brand}・${v.model}`; b.textContent = fmt(v.at); li.append(a, b); ul.appendChild(li);
    });
    const sum = box.querySelector(".sum"); sum.innerHTML = "";
    [["總共", snap.size], ...Object.entries(cnt)].forEach(([k, n]) => { const d = document.createElement("div"); d.innerHTML = "<b></b><span></span>"; d.querySelector("b").textContent = n; d.querySelector("span").textContent = k; sum.appendChild(d); });
  }, () => { box.querySelector(".sum").textContent = "讀不到資料，檢查一下 Firebase 規則。"; });
}
if (location.hash === STATS_KEY) setTimeout(showStats); else trackViews();
function openBoard() { $("board").classList.add("on"); $("fab").classList.add("on"); scrollTo(0, 0); }

$("replay").onclick = () => { $("board").classList.remove("on"); $("fab").classList.remove("on"); playFilm(); };



// ---------- 渲染 ----------
const fmt = (ts) => { if (!ts) return "剛剛"; const d = ts.toDate(), p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}（${"日一二三四五六"[d.getDay()]}）${p(d.getHours())}:${p(d.getMinutes())}`; };
const io = new IntersectionObserver((es) => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add("in"); io.unobserve(e.target);
  if (e.target.id === "end") { const r = e.target.getBoundingClientRect(); hearts(innerWidth / 2, r.top + 40, 16); }
}), { threshold: .25 });
const dogOrder = [14, 11, 2, 20, 8, 22, 1, 15, 12, 6, 4, 19];
let editing = null;

let filter = "";
document.querySelectorAll(".filter button").forEach(b => b.onclick = () => {
  filter = b.dataset.f; document.querySelectorAll(".filter button").forEach(x => x.classList.toggle("on", x === b)); tryRerender();
});
const isPost = (m) => m.tag === "留言" || m.tag === "兌換券";
function render(snap) {
  if (editing) return;                    // 編輯中不要重畫，避免打字被洗掉
  const feed = $("feed"), posts = $("posts");
  const seen = new Set([...document.querySelectorAll(".note.in")].map(n => n.dataset.id));
  feed.innerHTML = ""; posts.innerHTML = ""; let i = 0;
  const all = []; snap.forEach((d) => all.push(d));
  const cards = all.filter(d => !isPost(d.data()));
  const mine = all.filter(d => isPost(d.data()) && (!filter || d.data().who === filter)).reverse();   // 留言：新的在上面
  if (!mine.length) posts.innerHTML = `<p class="empty">${filter ? "這邊還沒有留言" : "還沒有留言，按右下角寫第一則吧"}</p>`;
  mine.forEach((d) => posts.appendChild(makeNote(d, seen, 0)));
  cards.forEach((d) => {
    feed.appendChild(makeNote(d, seen, i));
    if (++i % 4 === 0) { const g = document.createElement("div"); g.className = "inline-dog"; g.innerHTML = `<img src="stickers/s${String(dogOrder[(i / 4 - 1) % dogOrder.length]).padStart(2, "0")}.png" alt="" loading="lazy">`; feed.appendChild(g); }
  });
  $("end").innerHTML = ""; $("end").append(...ENDING.split("\n").flatMap((t, k, a) => k < a.length - 1 ? [t, document.createElement("br")] : [t]));
  io.observe($("end"));
}
function makeNote(d, seen, i) {
    const m = d.data(), el = document.createElement("article");
    el.className = `note ${m.who} s-${m.style || "plain"}`; el.dataset.id = d.id;
    el.style.setProperty("--r", `${((i * 37) % 7 - 3) * .6}deg`); el.style.setProperty("--tr", `${((i * 53) % 9 - 4)}deg`);
    const body = m.style === "facts" ? `<div class="facts"><b>相處模式</b><small>成分表・每份：一天</small>${m.text.split("\n").filter(Boolean).map(() => `<div class="row"><span></span><span></span></div>`).join("")}</div>`
      : m.style === "coupon" ? `<div class="ticket"><b></b><div class="sub"></div></div>` : `<div class="body"></div>`;
    el.innerHTML = `<div class="tag"></div>${body}<div class="foot"><span><span class="who"></span>　<span class="t"></span></span><span class="tools"><button data-a="edit">編輯</button><button data-a="del">刪除</button></span></div>`;
    el.querySelector(".tag").textContent = m.tag || "留言";
    if (m.style === "facts") el.querySelectorAll(".facts .row").forEach((r, k) => { r.style.transitionDelay = `${k * 120}ms`; const t = m.text.split("\n").filter(Boolean)[k], j = t.lastIndexOf(" "); r.children[0].textContent = j > 0 ? t.slice(0, j) : t; r.children[1].textContent = j > 0 ? t.slice(j + 1) : ""; });
    else if (m.style === "coupon") { const [a, ...b] = m.text.split("\n"); el.querySelector("b").textContent = a; el.querySelector(".sub").textContent = b.join(" "); el.classList.add("coupon"); }
    else el.querySelector(".body").textContent = m.text;
    el.querySelector(".who").textContent = m.who === "ian" ? "— Ian" : "— Celine";
    el.querySelector(".t").textContent = fmt(m.at) + (m.editedAt ? "・已編輯" : "");
    el.onclick = (e) => {
      const a = e.target.dataset?.a;
      if (a === "edit") return startEdit(el, d.id, m);
      if (a === "del") return confirm("確定要撕掉這張？") && api.del(d.id);
      if (m.style === "coupon") { el.classList.remove("used"); void el.offsetWidth; el.classList.add("used"); hearts(e.clientX, e.clientY, 14); }
    };
    if (seen.has(d.id)) el.classList.add("in"); else io.observe(el);
    return el;
}

function startEdit(el, id, m) {
  editing = id;
  const ta = document.createElement("textarea"); ta.className = "edit"; ta.value = m.text;
  const row = document.createElement("div"); row.className = "row"; row.style.cssText = "display:flex;justify-content:flex-end;gap:8px;margin-top:8px";
  const no = Object.assign(document.createElement("button"), { className: "btn ghost", textContent: "取消" });
  const ok = Object.assign(document.createElement("button"), { className: "btn", textContent: "儲存" });
  ok.style.background = "#2a2622"; ok.style.color = "#f1eadb";
  row.append(no, ok);
  [...el.children].forEach(c => { if (!c.classList.contains("tag")) c.remove(); });
  el.append(ta, row); el.onclick = null; ta.focus();
  no.onclick = () => { editing = null; tryRerender(); };
  ok.onclick = async () => { const t = ta.value.trim(); if (!t) return; ok.disabled = true; await api.edit(id, t); editing = null; tryRerender(); };
}
function tryRerender() { lastSnap && render(lastSnap); }

// ---------- 新增留言 ----------
const pick = (w) => { who = w; document.querySelectorAll(".who-pick button").forEach(b => b.classList.toggle("on", b.dataset.w === w)); };
document.querySelectorAll(".who-pick button").forEach(b => b.onclick = () => pick(b.dataset.w));
if (who) pick(who);
let kind = "";
document.querySelectorAll(".kind-pick button").forEach(b => b.onclick = () => {
  kind = b.dataset.k; document.querySelectorAll(".kind-pick button").forEach(x => x.classList.toggle("on", x === b));
  $("text").placeholder = kind ? "第一行寫券名（例如：按摩券）\n第二行寫說明（例如：一次 20 分鐘・不能拒絕）" : "想跟對方說的話⋯⋯";
});
$("fab").onclick = () => { $("sheet").classList.add("on"); setTimeout(() => $("text").focus(), 300); };
$("cancel").onclick = () => $("sheet").classList.remove("on");
$("send").onclick = async (e) => {
  const t = $("text").value.trim();
  if (!who) { document.querySelector(".who-pick").classList.add("shake"); setTimeout(() => document.querySelector(".who-pick").classList.remove("shake"), 400); return; }
  if (!t) return;
  $("send").disabled = true;
  try {
    store.set("board-who", who);
    await api.add({ who, text: t, tag: kind ? "兌換券" : "留言", style: kind });
    $("text").value = ""; $("sheet").classList.remove("on"); hearts(e.clientX, e.clientY, 12);
    setTimeout(() => $("postsSec").scrollIntoView({ behavior: "smooth" }), 400);
  } catch { alert("沒貼上去，再試一次"); }
  $("send").disabled = false;
};
</script>
</body>
</html>
